<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management – School Management System</title>
    <meta name="description" content="Manage system users and their roles." />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/featureGate.js?v=1.0"></script>
    <script src="js/theme.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <h1 style="margin:0;font-size:1.2rem;">User Management</h1>
          <p style="margin:0;opacity:.7;font-size:.85rem;">Manage system accounts, roles, and privileges.</p>
        </div>
        <div style="display:flex; gap:10px; align-items:center; margin-left:auto;">
          <a class="btn" href="dashboard.html">← Dashboard</a>
        </div>
      </header>
      <section class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px; border-bottom:1px solid var(--border-color); padding-bottom:12px;">
          <h3 style="margin:0; border:none; padding:0;">System Users</h3>
          <div id="superAdminTenantFilter" style="display:none; align-items:center; gap:8px;">
            <label style="font-size:0.78rem; font-weight:700; margin:0; text-transform:uppercase; color:var(--text-secondary);">School / Tenant Scope:</label>
            <select id="tenantSelect" onchange="onTenantFilterChange(this.value)" style="padding:6px 12px; font-size:0.83rem; font-weight:600; border-radius:6px; background:var(--input-bg); border:1px solid var(--border-color); color:var(--text-primary); cursor:pointer;">
              <option value="system_only" selected>👑 System & Super-Admins Only</option>
              <option value="all">🌐 All Accounts (Global System View)</option>
            </select>
          </div>
        </div>
        <div id="userList">Loading...</div>
      </section>
      <section class="card">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <h3 style="margin:0;">Add User</h3>
          <button type="button" class="btn secondary sm" id="btnOpenRoleModal" onclick="openAddRoleModal()">+ Add New Role/Privilege</button>
        </div>
        <form id="userForm" style="margin-top:15px;">
          <label>Username <input id="username" required placeholder="e.g. jdoe" /></label>
          <label>Email <input id="email" type="email" placeholder="e.g. jdoe@school.com" /></label>
          <label>Password <input id="password" type="password" required placeholder="Initial password" /></label>
          
          <div style="margin-top:10px; margin-bottom:15px;">
            <label style="font-weight:600; display:block; margin-bottom:6px;">Assigned System Privileges / Roles (Select all that apply):</label>
            <div id="rolesContainer" style="max-height:220px; overflow-y:auto; background:rgba(0,0,0,0.03); border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:10px;">
              Loading available privileges...
            </div>
          </div>

          <button type="submit" class="btn primary">Create User</button>
        </form>
        <div id="userMsg" style="margin-top:10px;"></div>
      </section>

      <!-- Add Role Modal -->
      <div id="addRoleModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:999; align-items:center; justify-content:center;">
        <div style="background:var(--card-bg, #1e293b); border:1px solid rgba(255,255,255,0.1); padding:24px; border-radius:12px; max-width:420px; width:90%;">
          <h3 style="margin-top:0;">Create Custom Role / Privilege</h3>
          <p style="font-size:0.85rem; opacity:0.75;">Add a new system position or privilege (e.g. Guidance Counselor, Bursar, Chaplain).</p>
          <form id="createRoleForm" onsubmit="handleCreateRole(event)">
            <label>Role Name
              <input id="newRoleName" required placeholder="e.g. Guidance Counselor" style="width:100%; margin-top:6px;" />
            </label>
            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
              <button type="button" class="btn secondary" onclick="closeAddRoleModal()">Cancel</button>
              <button type="submit" class="btn primary">Create Role</button>
            </div>
          </form>
        </div>
      </div>

      <section class="card">
        <h3>Link Parent & Student</h3>
        <form id="linkForm">
          <label>Parent
            <select id="link_parent_id" required><option value="">Loading parents...</option></select>
          </label>
          <label>Student
            <select id="link_student_id" required><option value="">Loading students...</option></select>
          </label>
          <button type="submit" class="btn primary">Link Account</button>
        </form>
      </section>
    </main>
    <script src="js/guard.js"></script>
    <script src="js/users.js"></script>
  </body>
</html>
